<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">

  <!-- ═══ Background ═══ -->
  <rect width="1200" height="630" fill="#fffaf5"/>

  <!-- Top orange accent strip (neo-brutalism) -->
  <rect x="0" y="0" width="1200" height="8" fill="#f97316"/>

  <!-- Subtle dot-grid (neo-brutalism texture) -->
  <defs>
    <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e5e7eb" opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="8" width="1200" height="622" fill="url(#grid)"/>

  <!-- Cream overlay to soften the grid -->
  <rect x="0" y="8" width="1200" height="622" fill="#fffaf5" opacity="0.82"/>

  <!-- Vertical separator (light dashed) -->
  <line x1="630" y1="50" x2="630" y2="535" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="6,6"/>


  <!-- ═══ LEFT SECTION — Branding ═══ -->

  <!-- Mini squircle logo shadow (neo-brutalism +3,+3) -->
  <rect x="63" y="53" width="72" height="72" rx="16" fill="#2b1e16"/>
  <!-- Mini squircle logo -->
  <rect x="60" y="50" width="72" height="72" rx="16" fill="#f97316"/>

  <!-- Main heading -->
  <text x="60" y="225"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="900"
    font-size="92"
    fill="#2b1e16"
    letter-spacing="-2">SABOROU</text>

  <!-- Orange underline (neo-brutalism) -->
  <rect x="60" y="235" width="510" height="6" rx="0" fill="#f97316"/>

  <!-- Japanese product name -->
  <text x="62" y="299"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, sans-serif"
    font-weight="700"
    font-size="40"
    fill="#f97316">サボロー</text>

  <!-- Tagline -->
  <text x="62" y="358"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, sans-serif"
    font-weight="500"
    font-size="21"
    fill="#6b7280">何んだって先延ばしにできるサービス</text>

  <!-- Subtitle line 1 -->
  <text x="62" y="396"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, sans-serif"
    font-weight="400"
    font-size="17"
    fill="#9ca3af">外部ツールの文脈をもとに、AIが「今サボっていいよ」を</text>

  <!-- Subtitle line 2 -->
  <text x="62" y="420"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, sans-serif"
    font-weight="400"
    font-size="17"
    fill="#9ca3af">根拠付きで提案するAIエージェント</text>

  <!-- Tech badge row -->
  <!-- React badge -->
  <rect x="62" y="456" width="82" height="28" rx="14" fill="#f97316" opacity="0.12"/>
  <text x="103" y="475"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700" font-size="13" fill="#ea580c" text-anchor="middle">React</text>

  <!-- Bedrock badge -->
  <rect x="154" y="456" width="108" height="28" rx="14" fill="#f97316" opacity="0.12"/>
  <text x="208" y="475"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700" font-size="13" fill="#ea580c" text-anchor="middle">Bedrock</text>

  <!-- Lambda badge -->
  <rect x="272" y="456" width="90" height="28" rx="14" fill="#f97316" opacity="0.12"/>
  <text x="317" y="475"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700" font-size="13" fill="#ea580c" text-anchor="middle">Lambda</text>

  <!-- DynamoDB badge -->
  <rect x="372" y="456" width="108" height="28" rx="14" fill="#f97316" opacity="0.12"/>
  <text x="426" y="475"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700" font-size="13" fill="#ea580c" text-anchor="middle">DynamoDB</text>


  <!-- ═══ RIGHT SECTION — サボローキャラクター (scale 3.5×) ═══ -->
  <!-- Character design per character-design-sheet.md §2–3 -->
  <!-- Positioned at translate(710, 80) scale(3.5): body occupies x≈815–1025, y≈185–430 -->

  <g transform="translate(710, 80) scale(3.5)">
    <!-- Clouds (can_saboru) — §3.4 -->
    <ellipse cx="42" cy="18" rx="12" ry="8" fill="#F3F4F6"/>
    <ellipse cx="58" cy="14" rx="14" ry="9" fill="#F3F4F6"/>
    <ellipse cx="74" cy="18" rx="11" ry="7" fill="#F3F4F6"/>

    <!-- Neo-brutalism shadow -->
    <path d="M 32 52 Q 32 32 52 32 L 72 32 Q 92 32 92 52 L 92 82 Q 92 102 72 102 L 52 102 Q 32 102 32 82 Z" fill="#2b1e16"/>

    <!-- Body squircle (can_saboru orange) — §2.1 -->
    <path d="M 30 50 Q 30 30 50 30 L 70 30 Q 90 30 90 50 L 90 80 Q 90 100 70 100 L 50 100 Q 30 100 30 80 Z" fill="#F97316"/>

    <!-- Highlight (艶) — §3.6 -->
    <ellipse cx="48" cy="48" rx="10" ry="6" fill="#FFFFFF" opacity="0.25"/>

    <!-- Cheeks — §3.3 -->
    <ellipse cx="42" cy="72" rx="6" ry="4" fill="#FED7AA" opacity="0.7"/>
    <ellipse cx="78" cy="72" rx="6" ry="4" fill="#FED7AA" opacity="0.7"/>

    <!-- Sleepy eyes (can_saboru) — §3.1 -->
    <path d="M 42 64 Q 47 67 52 64" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 68 64 Q 73 67 78 64" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Smile (can_saboru) — §3.2 -->
    <path d="M 54 80 Q 60 85 66 80" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Zzz cascade — §3.5 -->
    <text x="82" y="26" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" font-weight="700">z</text>
    <text x="92" y="16" font-family="system-ui, sans-serif" font-size="13" fill="#9CA3AF" font-weight="700">z</text>
    <text x="104" y="5"  font-family="system-ui, sans-serif" font-size="17" fill="#9CA3AF" font-weight="700">z</text>
  </g>


  <!-- ═══ BOTTOM BAR ═══ -->
  <rect x="0" y="568" width="1200" height="62" fill="#2b1e16"/>

  <!-- Event name -->
  <text x="60" y="608"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700" font-size="22" fill="#f97316">AWS Summit Japan 2026</text>

  <!-- Separator dot -->
  <circle cx="408" cy="599" r="4" fill="#6b7280"/>

  <!-- Hackathon label -->
  <text x="428" y="608"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="400" font-size="22" fill="#fffaf5">Hackathon</text>

  <!-- Right badge -->
  <rect x="1054" y="578" width="110" height="38" rx="8" fill="#f97316"/>
  <rect x="1051" y="575" width="110" height="38" rx="8" fill="none" stroke="#2b1e16" stroke-width="2"/>
  <rect x="1051" y="575" width="110" height="38" rx="8" fill="#f97316"/>
  <text x="1106" y="601"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="900" font-size="18" fill="#2b1e16" text-anchor="middle">AWS</text>

</svg>
