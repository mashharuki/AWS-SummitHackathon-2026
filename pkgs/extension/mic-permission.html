<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SABOROU マイク許可</title>
    <style>
      :root {
        color: #1f2937;
        background: #fffaf5;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(480px, calc(100vw - 48px));
        padding: 32px;
        border: 3px solid #2b1e16;
        border-radius: 20px;
        background: white;
        box-shadow: 0 8px 0 #2b1e16;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        line-height: 1.7;
      }

      button {
        width: 100%;
        margin-top: 16px;
        padding: 14px 20px;
        border: 2px solid #2b1e16;
        border-radius: 12px;
        background: #f97316;
        box-shadow: 0 4px 0 #2b1e16;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #status[data-state="success"] {
        color: #047857;
        font-weight: 700;
      }

      #status[data-state="error"] {
        color: #b91c1c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SABOROUのマイクを許可</h1>
      <p>
        音声でSABOROUと会話するため、Chromeにマイク利用を許可します。
        音声はElevenLabsとの会話中だけ使用します。
      </p>
      <button id="allow-microphone" type="button">マイクを許可</button>
      <p id="status" role="status">
        ボタンを押した後、Chromeの確認画面で「許可」を選んでください。
      </p>
    </main>
    <script type="module" src="/src/permission/main.ts"></script>
  </body>
</html>
