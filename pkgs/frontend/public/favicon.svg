  <!-- Zzz cascade — design-sheet §3.5 -->
  <text x="80" y="26" font-family="system-ui, sans-serif" font-size="9"  fill="#9CA3AF" font-weight="700">z</text>
  <text x="89" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF" font-weight="700">z</text>
  <text x="100" y="9" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF" font-weight="700">z</text>
