<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <!--
    SABOROU — Maskable PWA icon
    Safe zone: center 80% (x:12-108, y:12-108)
    Background fills edge-to-edge so OS can clip to any shape.
  -->

  <!-- Full-bleed orange background (maskable requirement) -->
  <rect width="120" height="120" fill="#f97316"/>

  <!-- Character group shifted +7px down so clouds clear the safe zone top (y≥12) -->
  <g transform="translate(0, 7)">
    <!-- Clouds (can_saboru) faint on orange bg — §3.4 -->
    <ellipse cx="42" cy="18" rx="12" ry="8" fill="#FFFFFF" opacity="0.18"/>
    <ellipse cx="58" cy="14" rx="14" ry="9" fill="#FFFFFF" opacity="0.18"/>
    <ellipse cx="74" cy="18" rx="11" ry="7" fill="#FFFFFF" opacity="0.18"/>

    <!-- Body shadow -->
    <path d="M 32 52 Q 32 32 52 32 L 72 32 Q 92 32 92 52 L 92 82 Q 92 102 72 102 L 52 102 Q 32 102 32 82 Z" fill="rgba(43,30,22,0.25)"/>

    <!-- Body squircle: cream on orange for contrast — §2.1 -->
    <path d="M 30 50 Q 30 30 50 30 L 70 30 Q 90 30 90 50 L 90 80 Q 90 100 70 100 L 50 100 Q 30 100 30 80 Z" fill="#fffaf5"/>

    <!-- Highlight — §3.6 -->
    <ellipse cx="48" cy="48" rx="10" ry="6" fill="#FFFFFF" opacity="0.30"/>

    <!-- Cheeks — §3.3 -->
    <ellipse cx="42" cy="72" rx="6" ry="4" fill="#FED7AA" opacity="0.85"/>
    <ellipse cx="78" cy="72" rx="6" ry="4" fill="#FED7AA" opacity="0.85"/>

    <!-- Sleepy eyes (can_saboru) — §3.1 -->
    <path d="M 42 64 Q 47 67 52 64" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 68 64 Q 73 67 78 64" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Smile (can_saboru) — §3.2 -->
    <path d="M 54 80 Q 60 85 66 80" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Zzz (within safe zone: x≤106) — §3.5 -->
    <text x="82" y="26" font-family="system-ui, sans-serif" font-size="9"  fill="#FFFFFF" font-weight="700" opacity="0.7">z</text>
    <text x="91" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700" opacity="0.7">z</text>
    <text x="102" y="9" font-family="system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" opacity="0.7">z</text>
  </g>
</svg>
